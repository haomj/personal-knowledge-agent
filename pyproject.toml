[project]
name = "personal-knowledge-agent"
version = "1.0.0"
description = "A personal knowledge research agent built with LangGraph, Agentic RAG, MCP, MultiAgent and HITL"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["langgraph", "langchain", "rag", "mcp", "ai-agent", "fastapi"]
dependencies = [
    "fastapi>=0.162.2",
    "langchain>=1.4.5",
    "langchain-chroma>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.1",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
personal-knowledge-agent = "app.cli:main"
personal-knowledge-ingest = "app.rag.ingest:main"
personal-knowledge-web = "app.web.server:run"

[project.urls]
Homepage = "https://github.com/haomj/personal-knowledge-agent"
Repository = "https://github.com/haomj/personal-knowledge-agent"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: 需要真实模型 API 的冒烟测试",
]
